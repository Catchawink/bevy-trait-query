[workspace]
resolver = "3"
members = [
  "bevy-trait-query",
  "bevy-trait-query-impl"
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
tracing = "0.1"
bevy_ecs = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types", default-features = false }
bevy_app = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types", default-features = false }

# proc macro
bevy-trait-query-impl = { version = "0.16.0", path = "./bevy-trait-query-impl" }
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro-crate = "3"

# dev deps
criterion = "0.5"
bevy = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types", default-features = false }
